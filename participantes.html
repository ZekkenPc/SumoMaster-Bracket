<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMOMASTERS // Participantes</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="floor"></div><div class="beam"></div>
<header>
  <div class="logo">
    <i>👥</i>
    <div>
      <h1 class="glitch" data-t="SUMOMASTERS">SUMO<span>MASTERS</span></h1>
      <p id="sub"></p>
    </div>
  </div>
  <div class="ctrls">
    <a class="btn" data-k="megasumo" href="#megasumo">Megasumo</a>
    <a class="btn" data-k="minisumo" href="#minisumo">Minisumo</a>
    <a class="btn" data-k="robo-soccer" href="#robo-soccer">Robo Soccer</a>
    <a class="btn y" id="goBr" href="index.html">⚡ Ver llaves</a>
  </div>
</header>
<main>
  <div class="bar">
    <button class="btn y" id="bReset">↺ Reiniciar avance</button>
    <button class="btn r" id="bSeed">⟲ Restaurar nombres de ejemplo</button>
    <button class="btn" id="bExp">⬇ Exportar respaldo</button>
    <label class="btn" style="cursor:pointer">⬆ Importar respaldo<input id="imp" type="file" accept="application/json" hidden></label>
  </div>
  <div class="fxp">
    <h4>⚡ Efectos de proyección</h4>
    <label class="sw"><input type="checkbox" data-c="live"><i></i><span>Efecto eléctrico en el combate actual</span></label>
    <label class="sw"><input type="checkbox" data-c="gold"><i></i><span>Dorado con rayos en la final</span></label>
    <label class="sw"><input type="checkbox" data-c="zap"><i></i><span>Rayos al registrar quién pasa</span></label>
  </div>
  <div id="grid" class="pg"></div>
  <p class="leg">Cambia el nombre de un robot y presiona Enter (o sal de la casilla): se actualiza en todas las fases de la llave. Los datos se guardan en este navegador; usa "Exportar respaldo" para pasarlos a otra computadora.</p>
</main>
<div id="toast"></div>
<script src="shared.js"></script>
<script>
const $=s=>document.querySelector(s),KS=Object.keys(SM.META),esc=SM.esc;
let S=SM.load(),k=KS.includes(location.hash.slice(1))?location.hash.slice(1):"megasumo";
function toast(t){const o=$("#toast");o.textContent=t;o.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>o.classList.remove("show"),1800)}
function row(m,t,i){
  const n=t.rounds[0][i],r=SM.reach(t,n),L=m.stages.length;
  const b=r===L-1?"🏆 Campeón":(r>0?"▶ Llegó a "+m.stages[r]:"");
  return `<div class="pr"><input class="in tag" data-i="${i}" data-f="tag" value="${esc(t.tags[i])}" title="Posición / bloque"><input class="in name" data-i="${i}" data-f="name" value="${esc(n)}"><span class="badge">${b}</span></div>`;
}
function render(){
  const m=SM.META[k],t=S[k];
  document.querySelectorAll("[data-k]").forEach(a=>a.classList.toggle("on",a.dataset.k===k));
  $("#goBr").href="index.html#"+k;
  $("#sub").innerHTML=`<span class="live"></span>Participantes · ${m.title}`;
  let h="";for(let i=0;i<t.rounds[0].length;i+=2)h+=`<div class="pm"><h4>Llave ${i/2+1}</h4>${row(m,t,i)}${row(m,t,i+1)}</div>`;
  $("#grid").innerHTML=h;
}
$("#grid").addEventListener("change",e=>{
  const x=e.target,i=+x.dataset.i,f=x.dataset.f,t=S[k],v=x.value.trim();if(!f)return;
  if(f==="tag")t.tags[i]=v;
  else{const old=t.rounds[0][i];if(!v||v===old){render();return}
    if(t.rounds[0].includes(v)){toast("⚠ Ya existe un robot con ese nombre");render();return}
    SM.rename(t,old,v)}
  SM.save(S);toast("✔ Guardado");render();
});
$("#bReset").onclick=()=>{if(confirm("¿Borrar el avance y los goles de este torneo? Los nombres se conservan.")){SM.resetProgress(S[k]);SM.save(S);toast("Avance reiniciado");render()}};
$("#bSeed").onclick=()=>{if(confirm("¿Restaurar los nombres de ejemplo de este torneo? Se pierde el avance.")){S[k]=SM.fresh(k);SM.save(S);toast("Restaurado");render()}};
$("#bExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="sumomasters-respaldo.json";a.click()};
$("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);for(const q of KS)if(!SM.valid(q,d[q]))throw 0;S=d;SM.save(S);toast("✔ Respaldo importado");render()}catch(x){toast("⚠ Archivo no válido")}};r.readAsText(f)};
document.querySelectorAll(".fxp input").forEach(i=>{
  i.checked=SM.cfg()[i.dataset.c];
  i.onchange=()=>{const c=SM.cfg();c[i.dataset.c]=i.checked;SM.setCfg(c);toast(i.checked?"✔ Efecto activado":"Efecto desactivado")};
});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(KS.includes(h)){k=h;render()}});
render();
</script>
</body>
</html>
